# Public demo deployment for https://im.januschka.com.
apiVersion: v1
kind: ConfigMap
metadata:
  name: im-local
  labels:
    app.kubernetes.io/name: im-local
data:
  IM_PORT: "8080"
  # The demo only processes its bundled samples and files uploaded to itself.
  IM_ALLOWED_HOSTS: "im.januschka.com"
  IM_ALLOWED_PATH_PREFIXES: "/sample.jpg,/sample-studio.jpg,/uploads/"
  IM_UPLOADS_ENABLED: "true"
  DEMO_MODE: "1"
  IM_CACHE_TTL: "90m"
  IM_UPLOAD_TTL: "90m"
  IM_CACHE_DIR: "/app/cache"
  IM_MODEL_DIR: "/app/models"
  IM_UPLOAD_DIR: "/app/uploads"
  IM_MAX_IMAGE_BYTES: "16777216"
  IM_MAX_IMAGE_PIXELS: "20000000"
  IM_MAX_OUTPUT_PIXELS: "25000000"
  IM_MAX_DIMENSION: "8192"
  IM_MAX_TRANSFORMATIONS: "20"
  IM_MAX_QUERY_BYTES: "16384"
  IM_MAX_CONCURRENT: "3"
  IM_QUEUE_TIMEOUT: "5s"
  IM_MAX_UPLOAD_BYTES: "10485760"
  IM_UPLOAD_STORAGE_BYTES: "536870912"
  IM_CACHE_STORAGE_BYTES: "5368709120"
  GIN_MODE: "release"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: im-local
  labels:
    app.kubernetes.io/name: im-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: im-local
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: im-local
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: im-local
          image: ghcr.io/hjanuschka/im-local:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: im-local
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "3Gi"
              ephemeral-storage: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: uploads
              mountPath: /app/uploads
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      volumes:
        # All user-created data is ephemeral and bounded. DEMO_MODE also removes
        # cache and upload artifacts older than 90 minutes from inside the app.
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: uploads
          emptyDir:
            sizeLimit: 512Mi
        - name: models
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: im-local
  labels:
    app.kubernetes.io/name: im-local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: im-local
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: im-local
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: im-local
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: im-local
  labels:
    app.kubernetes.io/name: im-local
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "11m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["im.januschka.com"]
      secretName: im-januschka-com-tls
  rules:
    - host: im.januschka.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: im-local
                port:
                  name: http
---
# Permit DNS and public internet HTTPS/HTTP, while denying access to cluster,
# private, loopback, and link-local networks. Application checks remain active
# as a second layer and pin connections to the validated DNS answer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: im-local-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: im-local
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
